####################################必选配置####################################
#联网安装
online_install=false
#安装用户
install_user=starrocks
#fe leader node
leader=10.175.76.77
#fe follower node
follower=10.175.76.78,10.175.76.79
#be node
backend=10.175.76.71,10.175.76.80,10.175.76.81,10.175.76.82,10.175.76.83
#是否安装并配置ntp
install_ntp=false
#ntp server ip
ntp_server_ip=10.138.132.122
#是否配置yum仓库
setup_yum_repo=false
#yum 仓库域名
repo_domain=mirrors.aliyun.com
#yum repo文件下载地址
yum_repo_url=http://mirrors.aliyun.com/repo/Centos-7.repo
#starrocks安装包下载地址
starrocks_download_url=https://releases.mirrorship.cn/starrocks/
#starrocks版本
starrocks_version=3.5.16
#starrocks安装包名称
package_filename=StarRocks-${starrocks_version}-centos-amd64.tar.gz
#安装包存放路径
package_path=/tmp/
#starrocks安装路径
install_path=/data1/starrocks
#yum安装jdk包名
jdk_package=java-17-openjdk-devel.x86_64
#JDK主版本
java_major_version=17
#java home路径
java_home=/usr/lib/jvm/java-17-openjdk
#是否安装AuditLoader审计日志插件
install_auditloader=true
#AuditLoader插件包本地路径
auditloader_package=/root/starrocks_installer/auditloader.zip
#AuditLoader HTTP服务端口
auditloader_http_port=18080
#AuditLoader审计表副本数
auditloader_replication_num=3
#AuditLoader专用StarRocks账号
auditloader_user=audit_loader
#AuditLoader专用StarRocks账号密码
auditloader_password=AuditLoader_123
####################################非必选配置####################################
#hdfs配置文件路径
hdfs_site_file=/home/starrocks/hdfs-site.xml
#core site文件路径
core_site_file=/home/starrocks/core-site.xml
#fe root密码
fe_root_password=
#starrocks升级包文件路径
upgrade_version=3.5.0
#starrocks升级包文件路径
downgrade_version=3.5.0
# FE扩容节点IP列表，多个IP用逗号分隔
scale_fe_ips=192.168.1.11,192.168.1.12

# BE扩容节点IP列表，多个IP用逗号分隔
scale_be_ips=192.168.1.21,192.168.1.22

# FE缩容节点IP列表，多个IP用逗号分隔
shrink_fe_ips=192.168.1.11,192.168.1.12

# BE缩容节点IP列表，多个IP用逗号分隔
shrink_be_ips=192.168.1.21,192.168.1.22
