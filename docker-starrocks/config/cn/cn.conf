#####################################################################
## The uppercase properties are read and exported by bin/start_cn.sh.
## To see all Compute Node configurations,
## see be/src/common/config.h
#####################################################################

# the output dir of stderr/stdout/gc
LOG_DIR = /opt/starrocks/cn/log

DATE = `date +%Y%m%d-%H%M%S`
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx1024m -XX:+UseG1GC -Xlog:gc*:/opt/starrocks/cn/log/cn.gc.log.$DATE:time"

# For jdk 9+, this JAVA_OPTS will be used as default JVM options
JAVA_OPTS_FOR_JDK_9="-Dlog4j2.formatMsgNoLookups=true -Xmx1024m -XX:+UseG1GC -Xlog:gc*:/opt/starrocks/cn/log/cn.gc.log.$DATE:time --add-opens=java.base/java.nio=ALL-UNNAMED"

##
## the lowercase properties are read by main program.
##

# INFO, WARN, ERROR, FATAL
sys_log_level = INFO

# ports for admin, web, heartbeat service 
be_port = 9060
be_http_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# Choose one if there are more than one ip except loopback address. 
# Note that there should at most one ip match this list.
# If no ip match this rule, will choose one randomly.
# use CIDR format, e.g. 10.10.10.0/24
# Default value is empty.
priority_networks = 172.20.0.0/16

# data root path, separate by ';'
# You can specify the storage medium of each root path, HDD or SSD
# you can add capacity limit at the end of each path, separate by ','
# eg:
# storage_root_path = /data1,capacity:50G,medium:SSD;/data2,capacity:1T,medium:HDD
# 
# Default value is ${STARROCKS_HOME}/storage
# For compute node in shared data mode, this path is used for caching data
# storage_root_path = /opt/starrocks/cn/storage

# Advanced configurations
# mem limit of BE
# physical memory * mem_limit_percent
mem_limit = 85%

# The maximum amount of data that can be processed by a query
# Default value is 0, which means no limit
query_mem_limit = 0

# Cache configurations for shared data mode
# Enable block cache
block_cache_enable = true

# Block cache memory size
# Default value is 20% of system memory
block_cache_mem_size = 6442450944

# Block cache disk size  
# Default value is 0, which means no disk cache
block_cache_disk_size = 21474836480

# Block cache disk path
block_cache_disk_path = /opt/starrocks/cn/storage/block_cache

# Enable checksum for block cache
block_cache_checksum_enable = true

# Datacache configurations
datacache_enable = true
datacache_mem_size = 2147483648
datacache_disk_size = 21474836480
datacache_disk_path = /opt/starrocks/cn/storage/datacache

# Number of threads for scanner
doris_scanner_thread_pool_thread_num = 16

# Number of threads for etl
etl_thread_pool_size = 8

# Number of threads for load
load_process_max_memory_limit_bytes = 107374182400

# Max number of load jobs running
load_process_max_memory_limit_percent = 50

# Spill configurations
spill_mode = auto
spill_mem_table_size = 268435456
spill_mem_table_num = 256
spill_mem_limit_threshold = 0.8

# Query configurations
scanner_thread_pool_thread_num = 16
scanner_thread_pool_queue_size = 102400

# Storage configurations
storage_flood_stage_usage_percent = 90
storage_flood_stage_left_capacity_bytes = 1073741824

# Compaction configurations
max_compaction_threads = 4
base_compaction_num_threads_per_disk = 1
cumulative_compaction_num_threads_per_disk = 1

# Tablet configurations
tablet_map_shard_size = 32
tablet_stat_cache_update_interval_second = 300

# RPC configurations
brpc_max_body_size = 2147483648
brpc_socket_max_unwritten_bytes = 1073741824

# Pipeline configurations
pipeline_exec_thread_pool_thread_num = 0
enable_pipeline_engine = true

# Vectorized engine configurations
vector_chunk_size = 4096
runtime_filter_max_size = 16777216

# Memory configurations
chunk_reserved_bytes_limit = 2147483648
column_dictionary_key_ratio_threshold = 0
column_dictionary_key_size_threshold = 0

# Experimental configurations
enable_event_based_compaction_framework = true
enable_size_tiered_compaction_strategy = true

# Monitoring configurations
report_task_interval_seconds = 10
report_disk_state_interval_seconds = 60

# Backup configurations
snapshot_expire_time_sec = 172800
trash_file_expire_time_sec = 259200

# Log configurations
log_buffer_level = ""
max_log_size = 1073741824
stop_logging_if_full_disk = true

# Routine load configurations
routine_load_thread_pool_size = 10

# Stream load configurations
streaming_load_max_mb = 10240
streaming_load_max_batch_size_mb = 100

# Export configurations
export_max_bytes_per_be_per_task = 268435456
export_running_job_num_limit = 5

# Publish configurations
transaction_publish_timeout_ms = 8000

# Consistency configurations
consistency_max_memory_mb = 10240

# Performance configurations
disable_mem_pools = false
chunk_reserved_bytes_limit = 2147483648

# Cloud native configurations for shared data mode
starlet_port = 9070
starlet_cache_dir = /opt/starrocks/cn/storage/starlet_cache
starlet_cache_size = 21474836480

# Object storage configurations
object_storage_access_key_id = minioadmin
object_storage_secret_access_key = minioadmin123
object_storage_endpoint = http://172.20.0.10:9000
object_storage_region = us-east-1