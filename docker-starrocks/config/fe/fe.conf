#####################################################################
## The uppercase properties are read and exported by bin/start_fe.sh.
## To see all Frontend configurations,
## see fe/src/main/java/com/starrocks/common/Config.java
#####################################################################

# the output dir of stderr/stdout/gc
LOG_DIR = /opt/starrocks/fe/log

DATE = `date +%Y%m%d-%H%M%S`
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:/opt/starrocks/fe/log/fe.gc.log.$DATE:time"

# For jdk 9+, this JAVA_OPTS will be used as default JVM options
JAVA_OPTS_FOR_JDK_9="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:/opt/starrocks/fe/log/fe.gc.log.$DATE:time --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens java.base/jdk.internal.ref=ALL-UNNAMED"

##
## the lowercase properties are read by main program.
##

# INFO, WARN, ERROR, FATAL
sys_log_level = INFO

# NORMAL, BRIEF, ASYNC
sys_log_mode = NORMAL

# Default dirs to put jdbc drivers,default value is ${STARROCKS_HOME}/lib/jdbc_drivers
# jdbc_drivers_dir = ${STARROCKS_HOME}/lib/jdbc_drivers

# store metadata, create it if it is not exist.
# Default value is ${STARROCKS_HOME}/meta
# meta_dir = /opt/starrocks/fe/meta

# Port to listen on
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# Choose one if there are more than one ip except loopback address. 
# Note that there should at most one ip match this list.
# If no ip match this rule, will choose one randomly.
# use CIDR format, e.g. 10.10.10.0/24
# Default value is empty.
priority_networks = 172.20.0.0/16

# Advanced configurations 
# log roll size
log_roll_size_mb = 1024

# sys_log_delete_age = 7d
# audit_log_delete_age = 30d
# audit_log_roll_num = 90
# audit_log_modules = slow_query, query, load, stream_load
# audit_log_roll_interval = 1d
# audit_log_roll_mode = SIZE-MB-1024

# Max number of client connections per FE
max_conn_per_user = 100

# Max number of connections from all users to all FEs
max_connections = 4096

# Load balance type. Available values are: round_robin, random, least_connections
# Default value is round_robin
load_balance_type = round_robin

# Limit on the number of expr children of an expr tree.
# Increase this limit if Planner throws 'exceed max children of expr tree' error.
expr_children_limit = 10000

# If set to true, the planner will try to execute aggregations by streaming.
# Default value is true
enable_streaming_preaggregation = true

# Max memory used by all queries. Unit: byte
# Default value is 90% of machine memory
exec_mem_limit = 17179869184

# Enable shared data mode for compute node
# Default value is false
enable_shared_data = true

# Cloud configuration for shared data mode
# Supported storage type: S3, AZBLOB, HDFS
# For S3, the cloud_properties format is:
# aws.s3.region = us-west-2
# aws.s3.endpoint = https://s3.us-west-2.amazonaws.com
# aws.s3.access_key = your-access-key
# aws.s3.secret_key = your-secret-key
# aws.s3.use_aws_sdk_default_behavior = false

# For MinIO (S3-compatible)
cloud_properties = {
    "aws.s3.enable_ssl": "false",
    "aws.s3.enable_path_style_access": "true",
    "aws.s3.endpoint": "http://172.20.0.10:9000",
    "aws.s3.access_key": "minioadmin",
    "aws.s3.secret_key": "minioadmin123",
    "aws.s3.region": "us-east-1"
}

# Default storage medium when create table
# HDD, SSD
default_storage_medium = HDD

# Default replication number when create table
default_replication_num = 3

# Advanced memory configurations
# Max memory limit for a single query. Unit: byte
# Default value is exec_mem_limit / 2
query_mem_limit = 8589934592

# Memory limit for load jobs. Unit: byte  
# Default value is exec_mem_limit / 10
load_mem_limit = 1717986918

# Enable automatic memory management
enable_auto_memory_adaptive = true

# Tablet scheduler configurations
max_scheduling_tablets = 10000
max_balancing_tablets = 500

# Disable tablet scheduler during peak hours
disable_balance = false
disable_colocate_balance = false

# Query timeout configurations
query_timeout = 300
insert_timeout = 14400

# Catalog configurations
catalog_try_lock_timeout_ms = 5000

# Backup and restore configurations
backup_job_default_timeout_ms = 86400000

# Routine load configurations
max_routine_load_job_num = 100

# Stream load configurations  
stream_load_default_timeout_second = 600
max_stream_load_timeout_second = 259200

# Broker load configurations
max_broker_load_job_num = 10

# Export configurations
export_max_bytes_per_be_per_task = 268435456
export_running_job_num_limit = 5

# Small file configurations
small_file_dir = /opt/starrocks/fe/small_files
max_small_file_size_bytes = 1048576
max_small_file_number = 100

# Plugin configurations
plugin_dir = /opt/starrocks/fe/plugins
plugin_enable = true

# Audit log configurations
audit_log_roll_mode = TIME-DAY
audit_log_roll_num = 30
audit_log_modules = slow_query, query, load, stream_load

# Statistics configurations
enable_collect_query_detail_info = true
statistic_auto_collect_ratio = 0.8
statistic_sample_collect_rows = 200000

# Performance configurations
parallel_fragment_exec_instance_num = 8
enable_pipeline_engine = true
pipeline_dop = 0

# Security configurations
authentication_ldap_simple_bind_base_dn = ""
authentication_ldap_simple_bind_root_dn = ""
authentication_ldap_simple_bind_root_pwd = ""

# Experimental configurations
enable_experimental_mv = false
enable_strict_storage_medium_check = false